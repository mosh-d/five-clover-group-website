<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline - Five Clover PMS</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f1ea; color: #2b2622;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 32rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { font-size: 1.6rem; margin: 0; }
  p { font-size: 1.1rem; line-height: 1.5; margin: 0; opacity: .8; }
  button { font: inherit; font-weight: 700; padding: 12px 28px; border-radius: 10px; border: 0; background: #2b2622; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/pms-icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>The PMS needs the internet. Nothing you were doing was lost - once the connection is back, try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
